name: Update Project Data
on:
  schedule:
    - cron: '0 * * * *' # Runs every hour at the start of the hour
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch pinned repositories and build projects.json
        env:
          GITHUB_USER: jadolation
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          query='query {
            user(login: "'"$GITHUB_USER"'") {
              pinnedItems(first: 6, types: REPOSITORY) {
                nodes {
                  ... on Repository {
                    name
                    description
                    url
                    stargazersCount
                    forkCount
                    primaryLanguage {
                      name
                    }
                  }
                }
              }
            }
          }'

          resp=$(curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$query" '{query: $q}')" \
            "https://api.github.com/graphql") || true

          echo "GraphQL response:"
          echo "$resp" | jq . || true

          nodes=$(echo "$resp" | jq -r '
            [
              (.data.user.pinnedItems.nodes // [])[]
              | select(.name != null)
              | {
                  name: .name,
                  description: .description,
                  url: .url,
                  stars: .stargazersCount,
                  forks: .forkCount,
                  language: (.primaryLanguage.name // null)
                }
            ]
          ')

          count=$(echo "$nodes" | jq 'length')

          if [ "$count" -gt 0 ]; then
            echo "$nodes" > projects.json
            cp projects.json main-page/projects.json
          else
            echo "No pinned items returned; keeping existing projects.json"
          fi

      - name: Commit and push projects.json
        run: |
          git add projects.json main-page/projects.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update projects.json"
          git push
