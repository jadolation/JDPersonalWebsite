name: Update Project Data
on:
  schedule:
    - cron: '0 * * * *' # Runs every hour at the start of the hour
  workflow_dispatch: # Allows you to run it manually for testing

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Fetch pinned repositories and build projects.json
        env:
          GITHUB_USER: jadolation
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          query='query {
            user(login: "'"$GITHUB_USER"'") {
              pinnedItems(first: 6, types: REPOSITORY) {
                nodes {
                  ... on Repository {
                    name
                    description
                    url
                    stargazersCount
                    forkCount
                    primaryLanguage {
                      name
                    }
                  }
                }
              }
            }
          }'
          resp=$(curl -s -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg q "$query" '{query: $q}')" \
            "https://api.github.com/graphql")
          echo "GraphQL response:"
          echo "$resp" | jq .
          nodes=$(echo "$resp" | jq -r '[.data.user.pinnedItems.nodes // [] | .[] | {name: .name, description: .description, url: .url, stars: .stargazersCount, forks: .forkCount, language: (.primaryLanguage.name // null)}]')
          if [ "$(echo "$nodes" | jq 'length')" -eq 0 ]; then
            cat > projects.json << 'JSONEOF'
[
  {
    "name": "ReyJrFerrer/SRV",
    "description": null,
    "url": "https://github.com/jadolation/ReyJrFerrer/SRV",
    "stars": 3,
    "forks": 3,
    "language": "TypeScript"
  },
  {
    "name": "JDPersonalWebsite",
    "description": "Its just my personal portfolio, nothing special",
    "url": "https://github.com/jadolation/JDPersonalWebsite",
    "stars": 1,
    "forks": 1,
    "language": "JavaScript"
  },
  {
    "name": "SOLID-Principles---Prompt-Engineering---GIT-101-Training-Activity",
    "description": null,
    "url": "https://github.com/jadolation/SOLID-Principles---Prompt-Engineering---GIT-101-Training-Activity",
    "stars": 0,
    "forks": 57,
    "language": "HTML"
  },
  {
    "name": "bettermapandan",
    "description": "Mapandan, Pangasinan joins the Better LGU initiative of BetterGov.ph through Better Mapandan, a transparency focused website created by independent web developers.",
    "url": "https://github.com/jadolation/bettermapandan",
    "stars": 2,
    "forks": 2,
    "language": "HTML"
  },
  {
    "name": "betterbasista",
    "description": null,
    "url": "https://github.com/jadolation/betterbasista",
    "stars": 1,
    "forks": 1,
    "language": "HTML"
  }
]
JSONEOF
          else
            echo "$nodes" > projects.json
          fi

      - name: Commit and push projects.json
        run: |
          git add projects.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "Auto-update projects.json"
          git push
